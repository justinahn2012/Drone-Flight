# One Take FPV: node tests on every push (native #1.2, perf "stale lightmap = fail"). About 1-2 min; capped at 10.
# Round 5 (P5, native #2): a second job loads the real game in headless Chromium on SwiftShader (no GPU) and fails on any
# page / console / shader error, runs the ?perf segments, checks every drawn mesh has an export entry and compares
# three golden stills (tests/browser.mjs, tests/golden.json). Its screenshots + perf/coverage JSON are an artifact.
# The site itself stays a static, build-free deploy. The npm dependencies live in ci/ (not at the root), so
# Cloudflare Pages finds no package.json and never npm-installs on deploy. Nothing here writes to the site root.
# Exports (world.glb, collider.glb, world.json, camera.json, graffiti.png) are NOT committed. Each run builds them into
# exports/ (git-ignored) and uploads them as the "exports" artifact (see PORTING.md, "Exports and CI").
# P2 (stream H, native #1-#4): Neon Seoul too. Its node tests, its parity vectors (tests/seoul-parity.mjs), its export
# (exports/seoul-hongdae: world/collider GLB, world.json, emitters/signs/screens/light/life/look JSON, signs.glb, the
# vendored KTX2 textures) built --strict and then re-checked byte for byte in a second process (determinism + coverage
# of the headless scene), and a third job that loads Seoul in headless Chromium (tests/browser.mjs --level).
# P3 (stream H, native #1/#4, colour #6): every test step runs even after an earlier one failed (`!cancelled()`), so one run
# shows every red suite. A suite with a failure already on main runs through ci/run.mjs, which tolerates only the FAIL lines
# listed in ci/known-failures.json (each names its owner; a fix that lands prints a notice). Added: seoul-light,
# seoul-dressing, camera-night, movers, test-facades, seoul-ui, and seoul-audio (own job: node-web-audio-api + libasound).
# Goldens: tests/golden.json, tests/golden-seoul-hongdae.json (re-baseline from a CI artifact: tests/browser.mjs
# --golden-from). The Seoul browser job ends with the camera gate (tools/camgate.py: exposure + colour rows, retro 0 + shipped).
# P4 (stream H, native #1): known failures are per shot and row with a ratchet (`limit`: a known row may improve, never get
# worse); the audio job runs through ci/run.mjs too (G2's rows after G1's traffic merged).
name: ci
on:
  push:
    branches: ['**']
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  # [P7 H] main's runs finish: browser-seoul takes ~2.3 h, and every integrator push within that window cancelled the run
  # before its camera gate (main had no completed browser-seoul since bc45fbe). Branches still cancel the superseded run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: tests/seoul-ui.mjs dates the stills against the look by git log per file
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ci/package-lock.json
      - name: Install three + three-mesh-bvh (versions = the index.html import map)
        run: |
          npm ci --prefix ci --ignore-scripts --no-audit --no-fund
          ln -s ci/node_modules node_modules
      - name: Syntax check (node --check on .mjs copies; on a .js ES module it is a no-op)
        run: |
          mkdir -p "$RUNNER_TEMP/chk"
          for f in *.js; do cp "$f" "$RUNNER_TEMP/chk/$f.mjs"; node --check "$RUNNER_TEMP/chk/$f.mjs"; done
          for f in tools/*.mjs tests/*.mjs seoul/tools/*.mjs ci/*.mjs; do node --check "$f"; done
          cp tests/coverage.js "$RUNNER_TEMP/chk/coverage.mjs"; node --check "$RUNNER_TEMP/chk/coverage.mjs"
      - name: Replay input logs (determinism + Take parity; a stale scripted log fails)
        if: ${{ !cancelled() }}
        run: node tests/replay.mjs --strict
      - name: Lightmaps match the geometry (stale = fail)
        if: ${{ !cancelled() }}
        run: node tools/test-lightmap.mjs
      - name: Take rules
        if: ${{ !cancelled() }}
        run: if [ -f tests/take.mjs ]; then node tests/take.mjs && HZ=240 node tests/take.mjs; else echo "::notice::no tests/take.mjs on this branch"; fi
      - name: Collision stress (lite)
        if: ${{ !cancelled() }}
        run: node tests/stress-lite.mjs
      - name: Export round trip
        if: ${{ !cancelled() }}
        run: node tools/test-export.mjs
      - name: Seoul level (layout schema, determinism, gates clear, lines score, collision stress)
        if: ${{ !cancelled() }}
        run: node seoul/tools/test-seoul.mjs
      - name: Seoul facades (C)
        if: ${{ !cancelled() }}
        run: node seoul/tools/test-facades.mjs
      - name: Known failures survive merges (H; a merge keeps every parent's ci/known-failures.json entry, or names it known-drop)
        if: ${{ !cancelled() }}
        run: node ci/known-guard.mjs
      - name: Seoul life (traffic determinism, budgets, sanity; known failures in ci/known-failures.json)
        if: ${{ !cancelled() }}
        run: node ci/run.mjs tests/seoul-life.mjs
      - name: Life worker (H; LifeSim off the main thread, bit-identical to the inline sim, seek-safe)
        if: ${{ !cancelled() }}
        run: node tests/life-worker.mjs
      - name: Phone perf plan (H; ?perf=a18 steps, state across reloads, the shared text)
        if: ${{ !cancelled() }}
        run: node tests/perf-plan.mjs
      - name: Seoul movers (F1 / G1)
        if: ${{ !cancelled() }}
        run: node tests/movers.mjs
      - name: Seoul signs (generator determinism, push invariants, L3 emitters)
        if: ${{ !cancelled() }}
        run: node tests/seoul-signs.mjs
      - name: Seoul light (D)
        if: ${{ !cancelled() }}
        run: node tests/seoul-light.mjs
      - name: Seoul dressing (E)
        if: ${{ !cancelled() }}
        run: node tests/seoul-dressing.mjs
      - name: Night camera (A)
        if: ${{ !cancelled() }}
        run: node tests/camera-night.mjs
      - name: Seoul UI (F2; known failures in ci/known-failures.json)
        if: ${{ !cancelled() }}
        run: node ci/run.mjs tests/seoul-ui.mjs
      - name: Seoul parity (flight log + Take events + traffic vectors; stale = fail, re-record with --record)
        if: ${{ !cancelled() }}
        run: node tests/seoul-parity.mjs --strict
      - name: Seoul night lightmap is current (one file, one key; stale = fail, fix with node tools/bakelm.mjs --night)
        if: ${{ !cancelled() }}
        run: |   # [P5 H, native #1 / #2] the game and the export both use seoul/light/night-lm.bin; a stale key bakes on the phone
          out=$(node tools/bakelm-night.mjs --check); echo "$out"
          echo "$out" | grep -q '^current:' || { echo "::error title=stale night lightmap (D / the integrator)::$(echo "$out" | tail -1): run node tools/bakelm.mjs --night on the merge and commit seoul/light/night-lm.bin"; exit 1; }
      - name: Build exports
        if: ${{ !cancelled() }}
        run: |
          node tools/export-world.mjs --out exports
          node tools/camera-profile.mjs --out exports
      - name: Seoul export (--strict; then a second process must reproduce every byte)
        if: ${{ !cancelled() }}
        run: |
          node tools/export-world.mjs --level seoul-hongdae --out exports/seoul-hongdae --strict
          node tools/export-world.mjs --level seoul-hongdae --out exports/seoul-hongdae --check --strict
      - name: Seoul bundle size (H; per-file deflate as an .ipa holds it, <= 60 MB)
        if: ${{ !cancelled() && hashFiles('exports/seoul-hongdae/world.json') != '' }}
        run: node ci/bundle-size.mjs exports/seoul-hongdae --max 60
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: exports
          path: exports/
          retention-days: 30

  # [P6 H, native #2] the native slice (native/OneTakeSeoul) compiled and run against this commit's own Seoul export
  # (the test job's "exports" artifact): GeoHash and SHA-256 vectors, every file's sha256, the collider bit for bit
  # (soupHash), world.glb meshopt decode within 2 mm of the game's bounds, the packed streams, and the night lightmap
  # (NLM2 key check + RGB9E5 texels, hash-equal to the JS decode). Linux first (Swift 6.1 container), then macOS, which
  # also builds the CryptoKit path that ships on the phone.
  native-linux:
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: exports
          path: exports
      - name: Toolchain extras (curl for the meshopt vendor script, zlib headers)
        run: command -v curl >/dev/null && [ -f /usr/include/zlib.h ] || { apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates zlib1g-dev; }
      - name: swift build + swift test (native/OneTakeSeoul against exports/seoul-hongdae)
        working-directory: native/OneTakeSeoul
        shell: bash
        run: |
          sh fetch-meshopt.sh
          swift build
          ONETAKE_EXPORT="$GITHUB_WORKSPACE/exports/seoul-hongdae" swift test 2>&1 | tee swift-test.log
          grep -q "with 0 failures" swift-test.log && ! grep -q "skipped" swift-test.log

  native-macos:   # [P6 H] the Apple side of the same package (CryptoKit, the SDK's zlib); no Metal code yet (PARITY.md section 4)
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: exports
          path: exports
      - name: swift build + swift test (macOS, Xcode's Swift)
        working-directory: native/OneTakeSeoul
        shell: bash
        run: |
          swift --version
          sh fetch-meshopt.sh
          swift build
          ONETAKE_EXPORT="$GITHUB_WORKSPACE/exports/seoul-hongdae" swift test 2>&1 | tee swift-test.log
          grep -q "with 0 failures" swift-test.log && ! grep -q "skipped" swift-test.log
      - name: iOS build (the package for the phone's SDK; compile only)
        working-directory: native/OneTakeSeoul
        shell: bash
        run: |   # SwiftPM's generated schemes: <package>-Package when there are several targets, else the product's name
          xcodebuild -list
          S=$(xcodebuild -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); s=(d.get("workspace") or d.get("project"))["schemes"]; print(next((x for x in s if x.endswith("-Package")), next((x for x in s if x == "SeoulBundle"), s[0])))')
          echo "scheme: $S"
          xcodebuild -scheme "$S" -destination 'generic/platform=iOS' -skipPackagePluginValidation build CODE_SIGNING_ALLOWED=NO | tail -20

  audio:   # [P3 H] G2's suite: offline Web Audio in node (node-web-audio-api, which links libasound), ~5 min
    runs-on: ubuntu-24.04   # [P4 H] pinned: ubuntu-latest is moving to 26.04, where apt-installed deps (libasound, playwright's) broke
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: tests/seoul-ui.mjs dates the stills against the look by git log per file
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ci/package-lock.json
      - name: Install three + node-web-audio-api (+ libasound)
        run: |
          npm ci --prefix ci --ignore-scripts --no-audit --no-fund
          ln -s ci/node_modules node_modules
          ldconfig -p | grep -q 'libasound.so.2 ' || { sudo apt-get update -qq && { sudo apt-get install -y -qq --no-install-recommends libasound2t64 || sudo apt-get install -y -qq --no-install-recommends libasound2; }; }
      - name: Seoul audio (G2 - calibration, determinism, the HQ clip path; known failures in ci/known-failures.json)
        run: node ci/run.mjs tests/seoul-audio.mjs

  browser:
    runs-on: ubuntu-24.04   # [P4 H] pinned (playwright --with-deps supports 24.04; 26.04 runs failed installing Chromium's deps)
    timeout-minutes: 45   # [P4 H] run 43040900806 passed every row but was cut at 30 (7 min lost to apt)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: tests/seoul-ui.mjs dates the stills against the look by git log per file
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ci/package-lock.json
      - name: Install three + three-mesh-bvh + playwright
        run: |
          npm ci --prefix ci --ignore-scripts --no-audit --no-fund
          ln -s ci/node_modules node_modules
      - name: Cache Playwright's Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('ci/package-lock.json') }}
      - name: Install Chromium (from Playwright's CDN; system libraries from apt when apt answers)
        run: |   # [P4 H] apt on the runners hung / failed resolving security.ubuntu.com (Nov 11): the browser download no longer waits on it
          for i in 1 2 3; do npx playwright install chromium && break; echo "::warning::playwright install failed (try $i)"; sleep 20; [ $i = 3 ] && exit 1; done
          timeout 180 npx playwright install-deps chromium || echo "::warning::playwright install-deps failed or timed out (apt): using the runner image's libraries"
        timeout-minutes: 12
      - name: Build exports (coverage reads world.json)
        run: node tools/export-world.mjs --out exports
      - name: Game in headless Chromium (SwiftShader)
        run: node tests/browser.mjs --exports exports --out browser-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser
          path: browser-out/
          retention-days: 14

  browser-seoul:   # SwiftShader renders Seoul slowly and runners vary 2x: 45 min on integ8, >90 on p3/H-ci 3450714 (stills
    runs-on: ubuntu-24.04    # 1548-2084 s each; stills.json now logs the seconds per step), so 180 (the limit is 360). [P4 H] pinned like browser
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: tests/seoul-ui.mjs dates the stills against the look by git log per file
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ci/package-lock.json
      - name: Install three + three-mesh-bvh + playwright
        run: |
          npm ci --prefix ci --ignore-scripts --no-audit --no-fund
          ln -s ci/node_modules node_modules
      - name: Cache Playwright's Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('ci/package-lock.json') }}
      - name: Install Chromium (from Playwright's CDN; system libraries from apt when apt answers)
        run: |   # [P4 H] apt on the runners hung / failed resolving security.ubuntu.com (Nov 11): the browser download no longer waits on it
          for i in 1 2 3; do npx playwright install chromium && break; echo "::warning::playwright install failed (try $i)"; sleep 20; [ $i = 3 ] && exit 1; done
          timeout 180 npx playwright install-deps chromium || echo "::warning::playwright install-deps failed or timed out (apt): using the runner image's libraries"
        timeout-minutes: 12
      - name: Build the Seoul export (coverage reads its world.json)
        run: node tools/export-world.mjs --level seoul-hongdae --out exports/seoul-hongdae
      - name: Neon Seoul in headless Chromium (SwiftShader; still rows tolerated while A, C, F2, G1, G2 land, see ci/known-failures.json)
        run: node ci/run.mjs tests/browser.mjs --level seoul-hongdae --exports exports/seoul-hongdae --out browser-out-seoul
      - uses: actions/setup-python@v5
        if: ${{ !cancelled() }}
        with:
          python-version: '3.12'
      - name: Camera gate (tools/camgate.py on the stills; known rows per shot, ratcheted, in ci/known-failures.json)
        if: ${{ !cancelled() && hashFiles('browser-out-seoul/stills.json') != '' }}
        run: |
          python -m pip install --quiet --disable-pip-version-check numpy pillow scipy
          node ci/run.mjs python tools/camgate.py --stills browser-out-seoul/camgate --evs browser-out-seoul/stills.json --hero walk0,club90,station --json browser-out-seoul/camgate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-seoul
          path: browser-out-seoul/
          retention-days: 14
