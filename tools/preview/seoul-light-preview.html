<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seoul Light Preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 12px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; left: 8px; top: 8px; background: rgba(0,0,0,.55); padding: 6px 8px; border-radius: 6px; }
  #ui label { display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <label>shot <select id="shot"></select></label>
  <label>retro <input id="retro" type="range" min="0" max="1" step="0.05" value="0.3"> <span id="rv">0.3</span></label>
  <label><input id="night" type="checkbox" checked> night camera</label>
  <div id="info"></div>
</div>
<script type="module" src="./preview.js"></script>
</body>
</html>
